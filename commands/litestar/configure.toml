### Library-specific notes

- **litestar-vite**: ask which frontend framework; scaffold the matching `vite.config.ts` from `skills/litestar-vite/references/modes.md`. For Inertia SPAs, configure via `VitePlugin(config=ViteConfig(inertia=InertiaConfig(...)))`; do not register a separate `InertiaPlugin` alongside `VitePlugin` (`skills/litestar-vite/references/inertia.md`)
- **litestar-htmx**: register `HTMXPlugin()` from `litestar_htmx` and use `HTMXRequest` / `HTMXTemplate` / `HX-*` response helpers; note that `hx-ext="litestar"` is a client helper from `litestar-vite-plugin`, not `litestar-htmx` (`skills/litestar-htmx/SKILL.md`)
- **litestar-queues**: ask which backend matches the project's stack (`SQLSpecBackendConfig`, `SQLAlchemyBackendConfig`, `RedisBackendConfig`, `ValkeyBackendConfig`, or ephemeral in-memory); wire `QueuePlugin(config=QueueConfig(backend=..., workers=[WorkerConfig(...)]))` and inject `NamedDependency[QueueService]` (`skills/litestar-queues/SKILL.md`)
- **litestar-saq**: ask for queue backend (Redis or Postgres); configure `QueueConfig` with the chosen DSN; add `use_server_lifespan=True` when sharing the web process in dev (`skills/litestar-saq/SKILL.md`)
- **litestar-mcp**: show which routes are marked with `mcp_tool=` / `mcp_resource=` / `mcp_prompt=` or registered via `@mcp.tool` / `@mcp.resource` / `@mcp.prompt`, and how to test with `POST /mcp` (`skills/litestar-mcp/SKILL.md`)
- **litestar-email**: configure `EmailPlugin(config=EmailConfig(backend=...))` (`"memory"`, `"console"`, `SMTPConfig`, `ResendConfig`, `SendGridConfig`, `MailgunConfig`, or `SESConfig`) and inject `email_service: NamedDependency[EmailService]` (`skills/litestar-email/SKILL.md`)
- **litestar-granian**: register `GranianPlugin()` in `plugins=[...]` and run via `litestar run` (`skills/litestar-granian/SKILL.md`)
- **advanced-alchemy**: if no models exist yet, scaffold an example domain using `/litestar:new-domain` (`skills/advanced-alchemy/SKILL.md`)
- **sqlspec**: ask which database adapter (asyncpg, psycopg, aiosqlite, oracledb, duckdb, adbc, etc.); scaffold the adapter config and `SQLSpecPlugin` (`skills/sqlspec/SKILL.md`)
- **litestar-security**: configure `SecurityPlugin(SecurityConfig(session=..., principal_resolver=..., exclude=[...]))`; subclass `SecureController` (`auth: ClassVar[AuthenticationPolicy] = required(...)` / `any_of(...)`) or `PublicController` on domain controllers (reserving `opt={"auth": ...}` for third-party/plugin controllers) and place authorization predicates (`requires_role`, `requires_scope`, `requires_tenant`) in `guards=[...]` (`skills/litestar-security/SKILL.md`)
- **pytest-databases**: add to `[project.optional-dependencies.test]` or `[dependency-groups]`, create `tests/conftest.py` with fixtures (`skills/pytest-databases/SKILL.md`)
- **litestar-autowire**: configure `domain_packages`; add `"dishka"` or `"queues"` to `integrations` only when those libraries are already in the project (`skills/litestar-autowire/SKILL.md`)

## Option 3: Environment Setup

Guide the user through:

1. **`.env` file** — create `.env` with all settings the app expects (from the settings dataclass)
2. **`.env.example`** — create a committed version with placeholder values
3. **Docker env** — create `.env.docker` for docker-compose overrides (service names instead of localhost)
4. **Secrets management** — for production: Google Secret Manager, AWS Secrets Manager, Vault, or Railway/Fly env vars. Show the `ENV_SECRETS` pattern from the canonical apps.
5. **`.gitignore` entry** — ensure `.env` and `.env.local` are ignored

## Option 4: App Architecture Patterns

For users structuring their `server/` module, show these canonical patterns:

### A) `ApplicationCore` Plugin (from `litestar-fullstack`)

The app's core wiring lives in a single `InitPlugin` class. This class:
- Sets `debug`, `openapi_config`, `cors_config`, `session_config`
- Registers all plugins (structlog, granian, alchemy/sqlspec, vite, queues/saq, email, domain)
- Adds exception handlers, signature namespace types, middleware
- Implements `CLIPluginProtocol` when it also needs to register CLI command groups

```python
from litestar.plugins import CLIPluginProtocol, InitPlugin


class ApplicationCore(InitPlugin, CLIPluginProtocol):
    def on_app_init(self, app_config: AppConfig) -> AppConfig:
        settings = get_settings()
        app_config.debug = settings.app.DEBUG
        app_config.openapi_config = OpenAPIConfig(title=settings.app.NAME, version="1.0.0")
        app_config.cors_config = config.cors
        app_config.exception_handlers = {ApplicationError: exception_to_http_response}
        app_config.plugins.extend([
            plugins.structlog, plugins.granian, plugins.alchemy,
            plugins.vite, plugins.get_saq_plugin(), plugins.email,
            plugins.domain,
        ])
        return app_config

    def on_cli_init(self, cli: Group) -> None:
        cli.add_command(user_management_group)
```

Then in `asgi.py`: `app = Litestar(plugins=[ApplicationCore()])` — one plugin to rule them all.

**Why:** centralizes all wiring decisions in one auditable place. Plugins, middleware, exception handlers, OpenAPI config, CLI commands — all discoverable from one class.

### B) Litestar Autowire

Use the published Autowire plugin when the app follows a domain-package layout
and benefits from automatic controller and listener registration:

```python
from litestar import Litestar
from litestar_autowire import AutowireConfig, AutowirePlugin


autowire = AutowirePlugin(
    AutowireConfig(
        domain_packages=["app.domain"],
        integrations=[],
    )
)
app = Litestar(plugins=[autowire])
```

Autowire discovers controllers and listeners from each configured domain
package. Add the optional `"dishka"` or `"queues"` integration only when the
project already uses that stack. It does not discover services, schemas, or
repositories.

**Trade-off:** import-based discovery reduces composition boilerplate in larger
domain-oriented apps. Small apps remain clearer with explicit routers.

### C) Manual Router and Plugin Composition

Keep the dependency graph explicit when the app is small or discovery is not a
good fit:

```python
from litestar import Litestar, Router

from app.domain.accounts.controllers import AccountsController
from app.domain.teams.controllers import TeamsController
from app.plugins import alchemy, granian


api_router = Router(
    path="/api",
    route_handlers=[AccountsController, TeamsController],
)
app = Litestar(
    route_handlers=[api_router],
    plugins=[alchemy, granian],
)
```

### D) `plugins.py` Module Pattern

Centralize all plugin instantiation in `server/plugins.py`:

```python
from functools import cache

structlog = StructlogPlugin(config=config.log)
vite = VitePlugin(config=config.vite)
alchemy = SQLAlchemyPlugin(config=config.alchemy)
granian = GranianPlugin()
autowire = AutowirePlugin(
    AutowireConfig(domain_packages=["app.domain"])
)


@cache
def get_saq_plugin() -> SAQPlugin:
    return SAQPlugin(config=config.get_saq_config())
```

For projects on `litestar-queues` instead of `litestar-saq`, wire `queues = QueuePlugin(config=config.queues)` in `server/plugins.py` (see `skills/litestar-queues/SKILL.md`).

**Why `@cache` for SAQ:** SAQ connects to Redis at plugin instantiation. Using `@cache` defers the connection to first access — avoids requiring Redis during `import` (important for Docker builds, tests, CLI commands that don't need SAQ).

## After configuring

Run `make check` to verify the configuration is valid and the app starts.
