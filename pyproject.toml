[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litestar-skills"
version = "0.10.0"
description = "Opinionated first-party agent skills, plugins, subagents, slash commands, and MCP servers for the Litestar framework ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Cody Fincher", email = "cofin@litestar.dev" },
]
keywords = ["litestar", "skills", "agent", "ai", "claude", "antigravity", "codex", "opencode", "cursor", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.11",
  "pyright>=1.1.380",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "bump-my-version>=0.28",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
  "tomli>=2.0 ; python_version < '3.11'",
  "litestar-skills[validation]",
]
# Libraries shipped guidance for. `tools/check-upstream-imports.py` verifies that
# every `from X import Y` in skill code samples resolves against the installed
# version, and `tests/upstream_contracts/` pins the API surface each skill claims.
# The `dev` extra depends on this group, so `uv sync --extra dev` alone gives a
# working environment — otherwise those checks silently run against stale or
# missing upstreams.
validation = [
  "advanced-alchemy[cli,cryptography,fsspec,obstore]>=1.11.0",
  "argon2-cffi>=23.1",  # advanced_alchemy.types.password_hash.argon2 imports argon2 at module load
  "dishka>=1.4",
  "flask>=3.0",        # advanced_alchemy.extensions.flask imports flask at module load
  "litestar[jinja,jwt]>=2.24.0",
  "litestar-autowire>=0.2.0",
  "litestar-email>=0.4.0",
  "litestar-granian>=0.16.0",
  "litestar-htmx>=0.5.0",
  "litestar-mcp[a2a]>=0.14.0",
  "litestar-queues[advanced-alchemy,sqlspec]>=0.12.0",
  "litestar-saq[psycopg]>=0.8.0",
  "litestar-security>=0.6.0",
  "litestar-vite>=0.32.0",
  "msgspec>=0.22.0",
  "polyfactory[beanie,sqlalchemy]>=3.3.0",
  "pytest-databases>=0.19.0",
  "sanic[ext]>=24.6",  # advanced_alchemy.extensions.flask/sanic imports sanic_ext at module load
  "sqlmodel>=0.0.27",
  "sqlspec[adk,asyncpg,duckdb,oracledb,performance,psycopg]>=0.65.0",
]

[project.urls]
Homepage = "https://github.com/litestar-org/litestar-skills"
Repository = "https://github.com/litestar-org/litestar-skills"
Issues = "https://github.com/litestar-org/litestar-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.build.targets.sdist]
include = [
  "tools",
  "skills",
  "commands",
  "agents",
  "mcp-servers",
  "templates",
  "hooks",
  "plugin.json",
  ".claude-plugin",
  ".codex-plugin",
  ".cursor-plugin",
  "AGENTS.md",
  "README.md",
  "LICENSE",
]

# ============================================================
# Ruff — linting + formatting
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".agents", ".beads", "node_modules", "plugins/litestar"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "C4", "T20", "RET", "SIM", "ARG"]
ignore = [
  "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "T201", "S603", "S607"]
"tools/**" = ["T201"]
"hooks/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy — strict type checking
# ============================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["\\.agents/", "\\.beads/", "node_modules/"]

# ============================================================
# pyright — secondary strict type checking
# ============================================================
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["tools", "tests"]
exclude = [".agents", ".beads", "node_modules", "**/__pycache__"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
# Silence deprecations from transitive tooling deps we neither control nor give
# guidance on. Scoped by message so real deprecations from the libraries the
# skills document (litestar, advanced-alchemy, sqlspec, msgspec, …) still surface.
filterwarnings = [
  "ignore:'MultiCommand' is deprecated:DeprecationWarning",          # rich_click -> click 9 shim
  "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",  # opentelemetry importlib.metadata
]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["tools"]
branch = true
omit = ["*/tests/*", "*/.agents/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ============================================================
# bump-my-version — atomic multi-manifest version sync
# ============================================================
[tool.bumpversion]
current_version = "0.10.0"
commit = false
tag = false
tag_name = "v{new_version}"
allow_dirty = true
message = "chore: bump version {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".claude-plugin/marketplace.json"
search = '      "version": "{current_version}"'
replace = '      "version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".codex-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "plugins/litestar/.codex-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".cursor-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".agents/plugins/marketplace.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "tools/install.sh"
search = 'VERSION="{current_version}"'
replace = 'VERSION="{new_version}"'

[[tool.bumpversion.files]]
filename = "tools/uninstall.sh"
search = 'VERSION="{current_version}"'
replace = 'VERSION="{new_version}"'

[[tool.bumpversion.files]]
filename = "tools/install.ps1"
search = "$script:Version = '{current_version}'"
replace = "$script:Version = '{new_version}'"

[[tool.bumpversion.files]]
filename = "tools/install.sh"
search = "litestar-skills/v{current_version}/"
replace = "litestar-skills/v{new_version}/"

[[tool.bumpversion.files]]
filename = "README.md"
search = "**v{current_version} — early access.**"
replace = "**v{new_version} — early access.**"
